apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-service
  labels:
    app: hostel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostel-service
  template:
    metadata:
      labels:
        app: hostel-service
    spec:
      containers:
        - name: hostel-service
          image: stableroomies/hostel-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_APPLICATION_NAME
              value: hostel-service
          # TODO: Add DATABASE_URL, REDIS_URL from Secrets

---
apiVersion: v1
kind: Service
metadata:
  name: hostel-service
spec:
  selector:
    app: hostel-service
  ports:
    - port: 8082
      targetPort: 8082
