services:

  # ── Databases (one per service) ──────────────────────────────────────────────

  postgres-student:
    image: postgres:17
    container_name: stable-roomies-postgres-student
    environment:
      POSTGRES_DB: student_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_student_data:/var/lib/postgresql/data
      - ./init-scripts/init-student-db.sql:/docker-entrypoint-initdb.d/init-student-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-hostel:
    image: postgres:17
    container_name: stable-roomies-postgres-hostel
    environment:
      POSTGRES_DB: hostel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_hostel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hostel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-allocation:
    image: postgres:17
    container_name: stable-roomies-postgres-allocation
    environment:
      POSTGRES_DB: allocation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_allocation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allocation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:17
    container_name: stable-roomies-postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-algorithm:
    image: postgres:17
    container_name: stable-roomies-postgres-algorithm
    environment:
      POSTGRES_DB: algorithm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_algorithm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algorithm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Shared Infrastructure ─────────────────────────────────────────────────────

  redis:
    image: redis:7
    container_name: stable-roomies-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: stable-roomies-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Services ──────────────────────────────────────────────────────────

  student-service:
    build:
      context: ../../backend/student-service
      dockerfile: Dockerfile
    container_name: stable-roomies-student-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: student-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-student:5432/student_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-student:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  hostel-service:
    build:
      context: ../../backend/hostel-service
      dockerfile: Dockerfile
    container_name: stable-roomies-hostel-service
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: hostel-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-hostel:5432/hostel_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres-hostel:
        condition: service_healthy
      redis:
        condition: service_healthy

  allocation-service:
    build:
      context: ../../backend/allocation-service
      dockerfile: Dockerfile
    container_name: stable-roomies-allocation-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: allocation-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-allocation:5432/allocation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-allocation:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ../../backend/notification-service
      dockerfile: Dockerfile
    container_name: stable-roomies-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Algorithm Engine ──────────────────────────────────────────────────────────

  algorithm-engine:
    build:
      context: ../../algorithm-engine
      dockerfile: Dockerfile
    container_name: stable-roomies-algorithm-engine
    ports:
      - "8090:8090"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-algorithm:5432/algorithm_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-algorithm:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Frontend ──────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: stable-roomies-frontend
    ports:
      - "5173:80"
    depends_on:
      - student-service
      - hostel-service
      - allocation-service

  # ── Gateway ───────────────────────────────────────────────────────────────────

  gateway:
    image: caddy:2
    container_name: stable-roomies-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../gateway/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - student-service
      - hostel-service
      - allocation-service
      - notification-service
      - algorithm-engine

volumes:
  postgres_student_data:
  postgres_hostel_data:
  postgres_allocation_data:
  postgres_notification_data:
  postgres_algorithm_data:
  redis_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
