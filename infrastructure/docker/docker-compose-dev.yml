version: '3.8'

services:
  # PostgreSQL for student service
  postgres-student:
    image: postgres:17
    container_name: stable-roomies-postgres-student
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_student_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for hostel service
  postgres-hostel:
    image: postgres:17
    container_name: stable-roomies-postgres-hostel
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hostel_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_hostel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hostel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_student_data:
  postgres_hostel_data:
