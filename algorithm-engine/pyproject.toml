[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "algorithm-engine"
version = "0.0.1"
description = "Stable Roomies – compatibility scoring and roommate allocation engine"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "aio-pika==9.4.3",
    "asyncpg==0.29.0",
    "sqlalchemy[asyncio]==2.0.35",
    "alembic==1.13.3",
    "redis[hiredis]==5.1.0",
    "numpy==2.1.1",
    "scikit-learn==1.5.2",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
]
