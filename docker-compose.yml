# RabbitMQ is local; the java-backend service connects directly
# to Neon serverless PostgreSQL. DB_* and GOOGLE_* values are interpolated
# from the root .env (docker compose auto-loads it from this directory).

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: stableroomie-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  java-backend:
    build:
      context: ./StableRoomie
      dockerfile: Dockerfile
    container_name: stableroomie-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${DB_DRIVER}"
      SPRING_JPA_DATABASE_PLATFORM: "${DB_DIALECT}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      APP_ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      FLASK_API_URL: http://flask-api:5000
      APP_MESSAGING_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  flask-api:
    build:
      context: ./flask-api
      dockerfile: Dockerfile
    container_name: stableroomie-flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - JAVA_BACKEND_URL=http://java-backend:8080
    depends_on:
      - java-backend

  caddy:
    image: caddy:2-alpine
    container_name: stableroomie-caddy
    restart: unless-stopped
    ports:
      # Windows commonly reserves port 80; use these local development ports.
      - "8081:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - java-backend

volumes:
  caddy_data:
  caddy_config:
