server:
  port: 8084

spring:
  application:
    name: notification-service

  # PostgreSQL — stores notification records
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    hibernate:
      ddl-auto: update        # auto-creates the notifications table
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # RabbitMQ — consume allocation events
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# RabbitMQ topology config
rabbitmq:
  notification:
    exchange: notification.exchange
    queue: notification.queue
    routing-key: notification.event

# Logging
logging:
  level:
    com.stableroomies.notificationservice: DEBUG
    org.springframework.web: INFO

# CORS
cors:
  allowed-origins: http://localhost:5173
