server:
  port: 8085

spring:
  application:
    name: auth-service

  # Loads ../../.env when the service is started from this directory, so the real
  # datasource credentials and JWT secret stay out of git. Optional, so the local
  # docker Postgres defaults below still apply when no .env is present.
  config:
    import: "optional:file:../../.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

auth:
  jwt:
    # HS256 signing key, base64-encoded and shared verbatim with the API gateway
    # (caddy-jwt decodes sign_key as base64). MUST be overridden outside local
    # development — this default is in the repository and therefore public.
    # Generate a real one with: openssl rand -base64 32
    # It must decode to >= 32 bytes; HMAC-SHA256 rejects anything shorter.
    secret: ${JWT_SECRET:c3RhYmxlLXJvb21pZXMtZGV2LW9ubHktand0LXNlY3JldC0zMmI=}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}
    issuer: stable-roomies-auth

  # Optional bootstrap: if no admin exists when the service starts, one is created
  # from these values. Leave blank to skip. Never used to update an existing user.
  admin:
    email: ${AUTH_ADMIN_EMAIL:}
    password: ${AUTH_ADMIN_PASSWORD:}
