spring:
  application:
    name: hostel-service
  datasource:
    url: jdbc:postgresql://localhost:5433/hostel_db?serverTimezone=UTC
    username: postgres
    password: postgres
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  port: 8082
