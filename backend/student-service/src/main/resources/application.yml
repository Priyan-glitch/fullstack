spring:
  application:
    name: student-service

  # Loads ../../.env when the service is started from this directory, so the real
  # datasource credentials stay out of git. Optional, so the local docker
  # Postgres defaults below still apply when no .env is present.
  config:
    import: "optional:file:../../.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  sql:
    init:
      mode: never
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8081
